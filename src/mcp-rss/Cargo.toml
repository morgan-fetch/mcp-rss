[package]
name = "mcp-rss"
version = "0.1.1"
description = "MCP server that provides RSS tooling."
repository = "https://github.com/haras-unicorn/mcp-rss"
authors = ["haras-unicorn <github@haras-unicorn.net>"]
license-file = "../../LICENSE.md"
readme = "../../README.md"
edition = "2024"

[dependencies]
anyhow = "1"
rmcp = { version = "3.1.2", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
