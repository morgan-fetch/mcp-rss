[package]
name = "mcp-rss"
version = "0.2.0"
description = "MCP server that provides RSS tooling."
repository = "https://github.com/haras-unicorn/mcp-rss"
authors = ["haras-unicorn <github@haras-unicorn.net>"]
license-file = "../../LICENSE.md"
readme = "../../README.md"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
lazy_static = "1.5.0"
readabilityrs = "0.1.4"
reqwest = { version = "0.12.28", features = ["json", "gzip"] }
rmcp = { version = "3.1.3", features = ["transport-io"] }
rss = { version = "2.1.0", features = ["chrono", "serde"] }
scraper = { version = "0.25.0", features = ["serde", "deterministic"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
wiremock = "0.6.5"
